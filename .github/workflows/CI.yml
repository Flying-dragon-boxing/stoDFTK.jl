name: CI

on:
  push:
    branches: [main, feature/lanczos]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.threads }} threads
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
        threads: [1]
        include:
          - julia-version: '1'
            threads: 4
    env:
      JULIA_CUDA_USE_COMPAT: 'false'
      OPENBLAS_NUM_THREADS: '1'
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Instantiate and test
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  mpi:
    name: MPI on 2 and 3 ranks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_CUDA_USE_COMPAT: 'false'
      OPENBLAS_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: MPI validation
        run: |
          julia --project=. test/run_mpi.jl 2
          julia --project=. test/run_mpi.jl 3
          julia --project=. test/run_mpi.jl 2 test/meta_mpi.jl
